services:
  front:
    # Construit l'image du frontend à partir du dossier front
    build: ./front

    # Limite les ressources utilisées par le frontend
    mem_limit: ${FRONT_MEMORY}
    cpus: ${FRONT_CPU}

    networks:
      - cookie-network

  back:
    # Construit l'image du backend à partir du dossier back
    build: ./back

    # Limite les ressources utilisées par le backend
    mem_limit: ${BACK_MEMORY}
    cpus: ${BACK_CPU}

    networks:
      - cookie-network

  proxy:
    # Construit l'image du reverse proxy à partir du dossier web-server
    build: ./web-server

    # Expose le proxy sur le port défini dans le fichier .env
    ports:
      - "${PROXY_PORT}:80"

    # Démarre le front et le back avant le proxy
    depends_on:
      - front
      - back

    # Limite les ressources utilisées par le proxy
    mem_limit: ${PROXY_MEMORY}
    cpus: ${PROXY_CPU}

    networks:
      - cookie-network

networks:
  cookie-network:
